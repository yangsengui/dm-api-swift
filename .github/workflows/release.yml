name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 0.1.0-beta.1)"
        required: false
        default: "0.1.0-beta.1"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ -z "${version}" ]]; then
            echo "Version input is required." >&2
            exit 1
          fi

          echo "package_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${version}" >> "${GITHUB_OUTPUT}"
      - run: swift test
      - name: Build source package
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          git archive --format=zip --output "dist/dm-api-swift-${{ steps.meta.outputs.package_version }}.zip" HEAD
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          prerelease: ${{ contains(steps.meta.outputs.package_version, '-') }}
          generate_release_notes: true
          files: dist/*
